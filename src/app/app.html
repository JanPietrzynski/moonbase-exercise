<mat-toolbar>
  <mat-icon aria-hidden="true">shield_moon</mat-icon>
  <h1>MOONBASE <span>CONTROL</span></h1>

  <span class="toolbar-spacer"></span>

  <div class="toolbar-actions">
    <button mat-icon-button type="button" aria-label="3 notifications">
      <mat-icon [matBadge]="notificationCount" matBadgeColor="primary" matBadgeSize="small">
        notifications
      </mat-icon>
    </button>

    <span class="user-avatar" aria-hidden="true">{{ userInitials }}</span>
  </div>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened>
    <app-nav></app-nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
