<section class="mission-status-card">
  <h3>Mission Status</h3>

  <div class="mission-status-content">
    <div class="mission-status-chart" [style.background]="chartGradient()">
      <div class="mission-status-chart-inner">
        <span class="mission-status-total">{{ total() }}</span>
        <span class="mission-status-label">Total</span>
      </div>
    </div>

    <ul class="mission-status-legend">
      @for (item of statusBreakdown(); track item.status) {
        <li class="mission-status-legend-item">
          <span class="mission-status-dot" [style.background-color]="item.color"></span>
          <span class="mission-status-name">{{ item.label }}</span>
          <span class="mission-status-count">{{ item.count }}</span>
          <span class="mission-status-percent">{{ item.percent }}%</span>
        </li>
      }
    </ul>
  </div>

  <a routerLink="/missions" class="mission-status-link">View all missions &gt;</a>
</section>
